<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>抖音视频无水印下载 - 学习项目</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #f5f5f7; color: #1d1d1f; min-height: 100vh;
        }
        nav {
            background: #fff; border-bottom: 1px solid #e5e5e7;
            padding: 14px 24px; display: flex; align-items: center;
            justify-content: space-between; position: sticky; top: 0; z-index: 10;
        }
        nav .logo { font-size: 20px; font-weight: 700; }
        nav .logo span { color: #fe2c55; }

        .hero { text-align: center; padding: 50px 20px 24px; }
        .hero h1 {
            font-size: 2em; font-weight: 700; margin-bottom: 10px;
            background: linear-gradient(135deg, #1d1d1f, #fe2c55);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }
        .hero p { color: #6e6e73; font-size: 1em; max-width: 600px; margin: 0 auto; }

        .search-box { max-width: 640px; margin: 24px auto; padding: 0 20px; }
        .input-wrap {
            display: flex; border-radius: 12px; overflow: hidden;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08); border: 1px solid #e5e5e7; background: #fff;
        }
        .input-wrap input {
            flex: 1; border: none; outline: none; padding: 14px 18px; font-size: 15px; background: transparent;
        }
        .input-wrap button {
            background: #1d1d1f; color: #fff; border: none; padding: 14px 24px;
            font-size: 15px; font-weight: 600; cursor: pointer; transition: background 0.2s; white-space: nowrap;
        }
        .input-wrap button:hover { background: #333; }
        .input-wrap button:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-paste {
            background: #fff !important; color: #1d1d1f !important;
            border-left: 1px solid #e5e5e7 !important; font-weight: 500 !important;
        }
        .btn-paste:hover { background: #f5f5f7 !important; }
        .error-msg { color: #ff3b30; text-align: center; margin-top: 10px; font-size: 14px; display: none; }
        .parse-status { color: #6e6e73; text-align: center; margin-top: 10px; font-size: 13px; }

        /* Result */
        .result { max-width: 680px; margin: 24px auto; padding: 0 20px; display: none; }
        .result-card {
            background: #fff; border-radius: 16px; overflow: hidden;
            box-shadow: 0 2px 16px rgba(0,0,0,0.06); border: 1px solid #e5e5e7;
        }
        .result-media {
            position: relative; width: 100%; padding-top: 56.25%; background: #000; overflow: hidden;
        }
        .result-media img, .result-media video {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; background: #000;
        }
        .result-body { padding: 20px 24px; }
        .result-title { font-size: 15px; font-weight: 600; margin-bottom: 6px; line-height: 1.6; word-break: break-all; }
        .result-meta { font-size: 13px; color: #6e6e73; margin-bottom: 16px; }
        .result-meta span { margin-right: 14px; }

        /* Download sections */
        .dl-section { margin-bottom: 20px; }
        .dl-section-title {
            font-size: 14px; font-weight: 600; color: #1d1d1f; margin-bottom: 10px;
            padding-bottom: 6px; border-bottom: 1px solid #f0f0f0;
        }
        .dl-options { display: flex; flex-direction: column; gap: 8px; }
        .dl-row {
            display: flex; align-items: center; justify-content: space-between;
            padding: 10px 14px; background: #fafafa; border-radius: 10px; border: 1px solid #f0f0f0;
        }
        .dl-row-info { display: flex; align-items: center; gap: 10px; }
        .dl-tag {
            display: inline-block; padding: 2px 8px; border-radius: 4px;
            font-size: 12px; font-weight: 600; background: #fe2c55; color: #fff;
        }
        .dl-label { font-size: 14px; font-weight: 500; }
        .dl-size { font-size: 13px; color: #6e6e73; }
        .dl-actions { display: flex; gap: 6px; }
        .btn-sm {
            padding: 7px 14px; border: none; border-radius: 8px; font-size: 13px;
            font-weight: 500; cursor: pointer; transition: all 0.2s; text-decoration: none;
        }
        .btn-download { background: #1d1d1f; color: #fff; }
        .btn-download:hover { background: #333; }
        .btn-copy { background: #f0f0f0; color: #1d1d1f; }
        .btn-copy:hover { background: #e5e5e7; }

        /* Image grid */
        .img-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
        .img-item {
            position: relative; border-radius: 8px; overflow: hidden; border: 1px solid #f0f0f0;
        }
        .img-item img { width: 100%; display: block; }
        .img-item .btn-sm {
            position: absolute; bottom: 6px; right: 6px;
            background: rgba(0,0,0,0.7); color: #fff; font-size: 12px; padding: 4px 10px;
        }

        /* Cover section */
        .cover-preview { margin-bottom: 12px; }
        .cover-preview img {
            max-width: 200px; border-radius: 8px; border: 1px solid #f0f0f0;
        }
        .cover-actions { display: flex; gap: 8px; margin-top: 8px; }

        /* Spinner */
        .spinner {
            display: inline-block; width: 16px; height: 16px;
            border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff;
            border-radius: 50%; animation: spin 0.6s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Features */
        .features {
            max-width: 800px; margin: 50px auto 30px; padding: 0 20px;
            display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px;
        }
        .feature-item {
            background: #fff; border-radius: 12px; padding: 20px 14px; text-align: center;
            border: 1px solid #e5e5e7;
        }
        .feature-item .icon { font-size: 26px; margin-bottom: 8px; }
        .feature-item h3 { font-size: 14px; font-weight: 600; }

        /* How-to */
        .howto { max-width: 680px; margin: 30px auto; padding: 0 20px; }
        .howto h2 { text-align: center; font-size: 1.4em; margin-bottom: 20px; }
        .steps { display: grid; gap: 12px; }
        .step {
            display: flex; gap: 12px; align-items: flex-start;
            background: #fff; border-radius: 12px; padding: 16px; border: 1px solid #e5e5e7;
        }
        .step-num {
            flex-shrink: 0; width: 32px; height: 32px; background: #f5f5f7; border-radius: 8px;
            display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px;
        }
        .step h3 { font-size: 14px; font-weight: 600; margin-bottom: 3px; }
        .step p { font-size: 13px; color: #6e6e73; line-height: 1.5; }

        footer {
            text-align: center; padding: 24px 20px; color: #aeaeb2; font-size: 12px;
            border-top: 1px solid #e5e5e7; margin-top: 30px;
        }
        footer p { margin-bottom: 3px; }

        .hidden { display: none !important; }

        @media (max-width: 500px) {
            .hero h1 { font-size: 1.5em; }
            .input-wrap { flex-direction: column; }
            .input-wrap button { padding: 12px; }
            .btn-paste { border-left: none !important; border-top: 1px solid #e5e5e7 !important; }
            .dl-row { flex-direction: column; align-items: flex-start; gap: 8px; }
        }
    </style>
</head>
<body>

<nav>
    <div class="logo">DouYin<span>Downloader</span></div>
    <div style="color:#aeaeb2;font-size:12px;">学习项目</div>
</nav>

<section class="hero">
    <h1>抖音视频无水印下载</h1>
    <p>粘贴抖音视频链接或分享文字，解析并下载无水印视频，支持多清晰度选择</p>
</section>

<div class="search-box">
    <div class="input-wrap">
        <input type="text" id="urlInput" placeholder="粘贴抖音视频链接或整段分享文字" autocomplete="off">
        <button class="btn-paste" onclick="pasteFromClipboard()">粘贴</button>
        <button id="btnParse" onclick="doParse()">解析视频</button>
    </div>
    <div class="error-msg" id="errorMsg"></div>
    <div class="parse-status" id="parseStatus" role="status" aria-live="polite"></div>
</div>

<div class="result" id="resultSection">
    <div class="result-card">
        <div class="result-media" id="resultMedia"></div>
        <div class="result-body">
            <div class="result-title" id="resultTitle"></div>
            <div class="result-meta" id="resultMeta"></div>

            <!-- 视频下载 -->
            <div class="dl-section" id="videoSection">
                <div class="dl-section-title">下载无水印视频</div>
                <div class="dl-options" id="videoOptions"></div>
            </div>

            <!-- 图片下载 -->
            <div class="dl-section hidden" id="imageSection">
                <div class="dl-section-title">下载无水印图片</div>
                <div class="img-grid" id="imageGrid"></div>
            </div>

            <!-- 封面下载 -->
            <div class="dl-section" id="coverSection">
                <div class="dl-section-title">下载封面图片</div>
                <div class="cover-preview" id="coverPreview"></div>
                <div class="cover-actions" id="coverActions"></div>
            </div>
        </div>
    </div>
</div>

<section class="features">
    <div class="feature-item"><div class="icon">&#127873;</div><h3>完全免费</h3></div>
    <div class="feature-item"><div class="icon">&#9889;</div><h3>无需登录</h3></div>
    <div class="feature-item"><div class="icon">&#10024;</div><h3>多清晰度</h3></div>
    <div class="feature-item"><div class="icon">&#128247;</div><h3>支持图集</h3></div>
</section>

<section class="howto">
    <h2>如何使用</h2>
    <div class="steps">
        <div class="step">
            <div class="step-num">1</div>
            <div><h3>复制链接</h3><p>打开抖音App，点击分享按钮，选择"复制链接"。</p></div>
        </div>
        <div class="step">
            <div class="step-num">2</div>
            <div><h3>粘贴并解析</h3><p>将复制的内容粘贴到输入框（支持整段分享文字），点击"解析视频"。</p></div>
        </div>
        <div class="step">
            <div class="step-num">3</div>
            <div><h3>选择清晰度下载</h3><p>解析完成后，选择需要的清晰度，点击下载按钮保存到本地。</p></div>
        </div>
    </div>
</section>

<footer>
    <p>纯学习项目，仅供学习交流使用</p>
    <p>视频版权归抖音及创作者所有</p>
</footer>

<script>
const urlInput = document.getElementById("urlInput");
const btnParse = document.getElementById("btnParse");
const errorMsg = document.getElementById("errorMsg");
const resultSection = document.getElementById("resultSection");

// Wrap any external URL through our proxy
function proxy(url) {
    return "/api/proxy?url=" + encodeURIComponent(url);
}

urlInput.addEventListener("keydown", e => { if (e.key === "Enter") doParse(); });

async function pasteFromClipboard() {
    try {
        const text = await navigator.clipboard.readText();
        urlInput.value = text;
        urlInput.focus();
    } catch (e) { urlInput.focus(); }
}

function showError(msg) {
    errorMsg.textContent = msg;
    errorMsg.style.display = "block";
    resultSection.style.display = "none";
}
function hideError() { errorMsg.style.display = "none"; }

async function doParse() {
    const url = urlInput.value.trim();
    if (!url) { showError("请输入抖音视频链接"); return; }
    if (!url.includes("douyin") && !url.includes("iesdouyin")) {
        showError("未检测到抖音链接，请粘贴包含抖音视频链接的文本");
        return;
    }
    hideError();
    btnParse.disabled = true;
    btnParse.innerHTML = '<span class="spinner"></span> 解析中...';
    document.getElementById("parseStatus").textContent = "正在获取作品数据，必要时会启动独立浏览器，通常需要数十秒。";
    resultSection.style.display = "none";

    try {
        const resp = await fetch("/api/parse?url=" + encodeURIComponent(url));
        const data = await resp.json();
        if (data.error) { showError(data.error); return; }
        showResult(data);
    } catch (e) {
        showError("网络错误，请重试");
    } finally {
        btnParse.disabled = false;
        btnParse.textContent = "解析视频";
        document.getElementById("parseStatus").textContent = "";
    }
}

function showResult(data) {
    // Media preview — use proxy to avoid 403
    const media = document.getElementById("resultMedia");
    media.innerHTML = "";
    if (data.default_video_url) {
        media.innerHTML = '<video src="' + esc(proxy(data.default_video_url)) + '" controls preload="metadata" playsinline></video>';
    } else if (data.cover_urls && data.cover_urls[0]) {
        media.innerHTML = '<img src="' + esc(proxy(data.cover_urls[0])) + '">';
    }

    // Title
    document.getElementById("resultTitle").textContent = data.title || "无标题";

    // Meta
    let metaHtml = "";
    if (data.author) metaHtml += "<span>作者: " + esc(data.author) + "</span>";
    if (data.duration) {
        const m = Math.floor(data.duration / 60), s = data.duration % 60;
        metaHtml += "<span>时长: " + (m > 0 ? m + "分" : "") + s + "秒</span>";
    }
    if (data.width && data.height) metaHtml += "<span>" + data.width + "x" + data.height + "</span>";
    if (data.play_count) metaHtml += "<span>播放: " + formatNum(data.play_count) + "</span>";
    if (data.digg_count) metaHtml += "<span>点赞: " + formatNum(data.digg_count) + "</span>";
    document.getElementById("resultMeta").innerHTML = metaHtml;

    // Video qualities
    const optDiv = document.getElementById("videoOptions");
    optDiv.innerHTML = "";
    document.getElementById("videoSection").classList.toggle("hidden", !data.qualities?.length);
    if (data.qualities && data.qualities.length) {
        data.qualities.forEach(q => {
            const row = document.createElement("div");
            row.className = "dl-row";
            row.innerHTML =
                '<div class="dl-row-info">' +
                    '<span class="dl-tag">' + esc(q.tag) + '</span>' +
                    '<span class="dl-label">' + esc(q.label) + '</span>' +
                    '<span class="dl-size" id="size_' + esc(q.label) + '">' + esc(q.size_text || "") + '</span>' +
                '</div>' +
                '<div class="dl-actions">' +
                    '<a class="btn-sm btn-download" href="' + esc(proxy(q.url)) + '" download="' + esc(sanitizeFilename(data.title) + '_' + q.label + '.mp4') + '">下载</a>' +
                    '<button class="btn-sm btn-copy" onclick="copyText(\'' + esc(q.url) + '\')">复制</button>' +
                '</div>';
            optDiv.appendChild(row);
            // 接口已返回大小时无需再发送 HEAD 请求。
            if (!q.size_text) fetchSize(q.url, "size_" + q.label);
        });
    }

    // Images (for image posts)
    const imgSection = document.getElementById("imageSection");
    const imgGrid = document.getElementById("imageGrid");
    imgGrid.innerHTML = "";
    if (data.images && data.images.length) {
        imgSection.classList.remove("hidden");
        data.images.forEach((imgUrl, i) => {
            const item = document.createElement("div");
            item.className = "img-item";
            item.innerHTML =
                '<img src="' + esc(proxy(imgUrl)) + '">' +
                '<a class="btn-sm" href="' + esc(proxy(imgUrl)) + '" download="' + esc(sanitizeFilename(data.title) + '_' + (i + 1) + '.jpg') + '">下载</a>';
            imgGrid.appendChild(item);
        });
    } else {
        imgSection.classList.add("hidden");
    }

    // Cover
    const coverPreview = document.getElementById("coverPreview");
    const coverActions = document.getElementById("coverActions");
    coverPreview.innerHTML = "";
    coverActions.innerHTML = "";
    if (data.cover_urls && data.cover_urls[0]) {
        coverPreview.innerHTML = '<img src="' + esc(proxy(data.cover_urls[0])) + '">';
        coverActions.innerHTML =
            '<a class="btn-sm btn-download" href="' + esc(proxy(data.cover_urls[0])) + '" download="' + esc(sanitizeFilename(data.title) + '_封面.jpg') + '">下载封面</a>' +
            '<button class="btn-sm btn-copy" onclick="copyText(\'' + esc(data.cover_urls[0]) + '\')">复制链接</button>';
    }

    resultSection.style.display = "block";
    resultSection.scrollIntoView({ behavior: "smooth", block: "start" });
}

async function fetchSize(url, elementId) {
    try {
        const resp = await fetch("/api/filesize?url=" + encodeURIComponent(url));
        const data = await resp.json();
        const el = document.getElementById(elementId);
        if (el && data.size_text) el.textContent = "(" + data.size_text + ")";
    } catch (e) {}
}

async function copyText(text) {
    try {
        await navigator.clipboard.writeText(text);
        alert("链接已复制");
    } catch (e) {
        const ta = document.createElement("textarea");
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        document.body.removeChild(ta);
        alert("链接已复制");
    }
}

function formatNum(n) {
    if (n >= 10000) return (n / 10000).toFixed(1) + "万";
    return n;
}

function esc(str) {
    const d = document.createElement("div");
    d.appendChild(document.createTextNode(str));
    return d.innerHTML;
}

function sanitizeFilename(name) {
    // Remove characters illegal in Windows/macOS/Linux filenames
    return name.replace(/[\\/:*?"<>|]/g, "").replace(/\s+/g, " ").trim() || "video";
}
</script>

</body>
</html>
